openapi: '3.1.1'
info:
    title: Sunglasses API
    description: API for managing sunglasses brands, products, and shopping carts.
    version: '1.0.0'
servers:
    - url: /api
paths:
    /brands:
        get:
            tags:
                - Brands
            summary: Get all brands
            description: Returns a list of all available sunglasses brands.
            operationId: getBrands
            security: []
            responses:
                '200':
                    description: Successfully retrieves all brands; or returns an empty array if no brands exist.
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/Brand'
    /brands/{id}/products:
        get:
            tags:
                - Brands
            summary: Get products for a brand
            description: Returns all products belonging to the specified brand.
            operationId: getBrandProducts
            security: []
            parameters:
                - name: id
                  in: path
                  required: true
                  description: Unique identifier of the brand.
                  schema:
                      type: string
            responses:
                '200':
                    description: Successfully retrieves products for the brand; or returns an empty array if the brand has no products.
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/Product'
                '404':
                    description: Brand not found.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /products:
        get:
            tags:
                - Products
            summary: Get products
            description: Returns all products; or filters them by product name, description, or brand name when a search query is provided.
            operationId: getProducts
            security: []
            parameters:
                - name: q
                  in: query
                  required: false
                  description: Optional case-insensitive search term matched against product names, descriptions, or brand names.
                  schema:
                      type: string
            responses:
                '200':
                    description: Successfully retrieves products; or returns an empty array if no products match the search.
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/Product'
    /login:
        post:
            tags:
                - Authentication
            summary: Login user
            description: Authenticates a user and returns a JWT access token.
            operationId: login
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/LoginRequest'
            responses:
                '200':
                    description: Successfully authenticated.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/LoginResponse'
                '400':
                    description: Missing or invalid request fields.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '401':
                    description: Invalid email or password.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /me/cart:
        get:
            tags:
                - Cart
            summary: Get the user's cart
            description: Returns the authenticated user's shopping cart, including product details and quantities.
            operationId: getCart
            security:
                - bearerAuth: []
            responses:
                '200':
                    description: Successfully retrieves the user's cart; returns an empty cart if no products have been added.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Cart'
                '401':
                    description: Missing, invalid, or expired authentication token.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
        post:
            tags:
                - Cart
            summary: Add a product to the cart.
            description: Adds a product to the authenticated user's cart; increases the quantity if the product already exists in the cart.
            operationId: addToCart
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AddCartRequest'
            responses:
                '200':
                    description: Product successfully added to the cart and returns the updated cart.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Cart'
                '400':
                    description: Missing or invalid request fields.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '401':
                    description: Missing, invalid, or expired authentication token.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '404':
                    description: Product not found.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '409':
                    description: Product is currently unavailable.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /me/cart/{productId}:
        post:
            tags:
                - Cart
            summary: Update cart item quantity
            description: Updates the quantity of an existing product in the authenticated user's cart.
            operationId: updateCartQuantity
            security:
                - bearerAuth: []
            parameters:
                - name: productId
                  in: path
                  required: true
                  description: Unique identifier of the product in the cart.
                  schema:
                      type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateCartQuantityRequest'
            responses:
                '200':
                    description: Cart item quantity successfully updated and returns the updated cart.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Cart'
                '400':
                    description: Missing or invalid request fields.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '401':
                    description: Missing, invalid, or expired authentication token.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '404':
                    description: Product not found in the user's cart.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
        delete:
            tags:
                - Cart
            summary: Remove a product from the cart
            description: Removes the specified product completely from the authenticated user's cart.
            operationId: removeFromCart
            security:
                - bearerAuth: []
            parameters:
                - name: productId
                  in: path
                  required: true
                  description: Unique identifier of the product to remove from the cart.
                  schema:
                      type: string
            responses:
                '204':
                    description: Product successfully removed from the cart.
                '401':
                    description: Missing, invalid, or expired authentication token.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '404':
                    description: Product not found in the user's cart.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
components:
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT
    schemas:
        Brand:
            type: object
            required:
                - id
                - name
            properties:
                id:
                    type: string
                name:
                    type: string
        Product:
            type: object
            required:
                - id
                - categoryId
                - name
                - description
                - price
                - imageUrls
            properties:
                id:
                    type: string
                categoryId:
                    type: string
                name:
                    type: string
                description:
                    type: string
                price:
                    type: number
                imageUrls:
                    type: array
                    items:
                        type: string
                        format: uri
        Cart:
            type: object
            required:
                - items
                - total
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/CartItem'
                total:
                    type: number
                    minimum: 0
        CartItem:
            type: object
            required:
                - product
                - quantity
            properties:
                product:
                    $ref: '#/components/schemas/Product'
                quantity:
                    type: integer
                    minimum: 1
        AddCartRequest:
            type: object
            required:
                - productId
            properties:
                productId:
                    type: string
                quantity:
                    type: integer
                    default: 1
                    minimum: 1
        UpdateCartQuantityRequest:
            type: object
            required:
                - quantity
            properties:
                quantity:
                    type: integer
                    minimum: 1
        LoginRequest:
            type: object
            required:
                - email
                - password
            properties:
                email:
                    type: string
                    format: email
                password:
                    type: string
                    writeOnly: true
                    minLength: 1
        LoginResponse:
            type: object
            required:
                - token
            properties:
                token:
                    type: string
                    description: JWT access token used to authenticate protected API requests.
        Error:
            type: object
            required:
                - error
            properties:
                error:
                    type: string
